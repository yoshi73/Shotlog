<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Shotlog">
<meta name="theme-color" content="#1F4D3A"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg">
<title>Shotlog</title>
<style>
:root{--g:#1F4D3A;--bg:#F4F1E8;--ink:#17261F;--sub:#4A5750;--chip:#E6E1D1;--lime:#C8E36B;--card:#FBF9F3;--line:#E1DCCB}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,'Noto Sans JP',system-ui,sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button{font:inherit;cursor:pointer}
.top{padding:calc(14px + env(safe-area-inset-top)) 20px 8px;display:flex;align-items:center;justify-content:space-between}
h1{margin:0;font-size:24px}.wrap{padding:4px 20px 24px;display:flex;flex-direction:column;gap:18px}
.lab{font-size:13px;font-weight:700;color:var(--sub);margin-bottom:6px}
.btn{height:48px;border:0;border-radius:12px;background:var(--g);color:var(--bg);font-weight:700;font-size:16px;width:100%}
.btn.sub{background:var(--chip);color:var(--g)}.btn.sm{height:40px;width:auto;padding:0 16px;font-size:14px}
input[type=text],textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;font:inherit;font-size:16px}
textarea{min-height:120px;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{height:40px;min-width:44px;padding:0 14px;border-radius:10px;border:0;background:var(--chip);color:var(--g);font-weight:700}
.chip.on{background:var(--g);color:var(--bg)}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px}.seg button{flex:1;height:38px;border:0;border-radius:10px;background:none;font-weight:700;color:var(--g)}.seg .on{background:var(--g);color:var(--bg)}
.prev{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.6;white-space:pre-line}
.prev b{color:var(--g)}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:4px}
.th{position:relative;flex:0 0 auto;width:64px;height:64px;border-radius:12px;background:#D9D3C0;border:3px solid transparent;overflow:hidden;padding:0}
.th.on{border-color:var(--g)}.th video,.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .x{position:absolute;right:0;top:0;background:#17261F;color:#fff;width:22px;height:22px;border-radius:0 0 0 8px;font-size:13px;line-height:22px;text-align:center}
.th .st{position:absolute;right:2px;bottom:2px;background:var(--lime);border-radius:10px;width:20px;height:20px;font-size:12px;line-height:20px;text-align:center}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;color:var(--ink)}
.row small{color:var(--sub);display:block;margin-top:4px;font-size:13px}
.pill{background:var(--chip);color:var(--g);border-radius:16px;padding:4px 12px;font-weight:700;font-size:14px;height:30px;white-space:nowrap}
.tab{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tab button{flex:1;height:56px;border:0;background:none;font-weight:700;color:var(--sub);font-size:14px}.tab .on{color:var(--g)}
.media{width:100%;border-radius:16px;background:#000;max-height:60vh}
.hint{font-size:12px;color:var(--sub)}
</style></head><body>
<div id="app"></div>
<nav class="tab" id="tab"></nav>
<script>
// ---------- storage (IndexedDB) ----------
let db;
const open=()=>new Promise((res,rej)=>{const r=indexedDB.open('shotlog',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('sessions',{keyPath:'id'});d.createObjectStore('media',{keyPath:'id'});d.createObjectStore('events',{autoIncrement:true})};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)});
const tx=(s,m='readonly')=>db.transaction(s,m).objectStore(s);
const p=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const all=s=>p(tx(s).getAll()), del=(s,k)=>p(tx(s,'readwrite').delete(k));
// iOS Safari: Blobをそのまま保存するとUnknownErrorになるため、ArrayBufferで保存して読むときにBlobへ戻す
const put=async(s,v)=>{if(s==='media'&&v.blob){if(v.blob instanceof File){try{return await p(tx(s,'readwrite').put(v))}catch(_){}}const buf=await v.blob.arrayBuffer();v={id:v.id,type:v.type,name:v.name,buf}}return p(tx(s,'readwrite').put(v))};
const get=async(s,k)=>{const r=await p(tx(s).get(k));if(r&&r.buf&&!r.blob)r.blob=new Blob([r.buf],{type:r.type});return r};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const log=(e,x)=>{try{tx('events','readwrite').add({t:Date.now(),e,...x})}catch(_){}};
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();

// ---------- state ----------
const CLUBS=['Dr','3W','5W','UT','5I','6I','7I','8I','9I','PW','AW','SW','Pt'];
let view='new',cur=null,draft=null,sessions=[],urls=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmt=s=>{const d=new Date(s+'T00:00:00');return (d.getMonth()+1)+'月'+d.getDate()+'日('+'日月火水木金土'[d.getDay()]+')'};
const blobUrl=b=>{const u=URL.createObjectURL(b);urls.push(u);return u};
const freeUrls=()=>{urls.forEach(URL.revokeObjectURL);urls=[]};

async function load(){sessions=(await all('sessions')).sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created)}
function newDraft(kind){return {id:uid(),kind:kind||'practice',date:today(),place:'',cond:3,memo:'',clubs:[],media:[],best:null,created:Date.now()}}
function go(v,s){stopCam();view=v;if(s!==undefined)cur=s;log('view',{v});render()}

// ---------- render ----------
async function render(){
  freeUrls();await load();
  $('tab').style.display=(view==='round'||view==='rpre')?'none':'flex';
  $('tab').innerHTML=[['new','入力'],['list','一覧']].map(([k,l])=>`<button class="${view===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
  if(view==='new')return renderNew();
  if(view==='list')return renderList();
  if(view==='detail')return renderDetail();
  if(view==='round')return renderRound();
  if(view==='rpre')return renderRPre();
}
async function thumbs(ids,sel,best,rm){
  let h='';for(let i=0;i<ids.length;i++){const m=await get('media',ids[i]);if(!m)continue;const u=blobUrl(m.blob);
    const tag=m.type.startsWith('video')?`<video src="${u}#t=0.1" muted playsinline preload="metadata"></video>`:`<img src="${u}">`;
    h+=`<button class="th ${i===sel?'on':''}" onclick="pick(${i})">${tag}${ids[i]===best?'<span class="st">★</span>':''}${rm?`<span class="x" onclick="event.stopPropagation();rmMedia(${i})">×</span>`:''}</button>`}
  return h}
async function renderNew(){
  if(!draft)draft=newDraft();
  const prevS=sessions.find(s=>s.kind===draft.kind&&s.memo);
  const prev=prevS?`<div><div class="lab">前回のメモ(${fmt(prevS.date)})</div><div class="prev">${esc(prevS.memo)}</div></div>`:'';
  $('app').innerHTML=`<div class="top"><h1>Shotlog</h1><button class="btn sm sub" onclick="exportEvents()">使用記録</button></div>
  <div class="wrap">
  <div class="seg"><button class="on">練習</button><button onclick="go('round')">ラウンド</button></div>
  ${prev}
  <div><div class="lab">日付</div><input type="text" id="date" value="${draft.date}" onchange="draft.date=this.value" style="display:none"><input type="date" value="${draft.date}" onchange="draft.date=this.value" style="width:100%;height:48px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font:inherit;background:var(--card)"></div>
  <div><div class="lab">場所</div><input type="text" value="${esc(draft.place)}" placeholder="○○ゴルフ練習場" oninput="draft.place=this.value"></div>
  <div><div class="lab">調子</div><div class="chips">${[1,2,3,4,5].map(n=>`<button class="chip ${draft.cond===n?'on':''}" onclick="draft.cond=${n};renderNew()">${n}</button>`).join('')}</div></div>
  <div><div class="lab">メモ</div><textarea oninput="draft.memo=this.value" placeholder="意識したこと、次にやること">${esc(draft.memo)}</textarea></div>
  <div><div class="lab">使ったクラブ</div><div class="chips">${CLUBS.map(c=>`<button class="chip ${draft.clubs.includes(c)?'on':''}" onclick="toggleClub('${c}')">${c}</button>`).join('')}</div></div>
  <div><div class="lab">動画・写真</div>
   <div class="thumbs" id="th">${await thumbs(draft.media,-1,draft.best,true)}</div>
   <input type="file" id="file" accept="video/*,image/*" multiple hidden onchange="addFiles(this.files)">
   <button class="btn sub" onclick="$('file').click()" style="margin-top:8px">動画・写真を選ぶ</button>
   <div class="hint" style="margin-top:6px">カメラロールから選ぶと、アプリ内に取り込まれます(元は消えません)</div></div>
  <button class="btn" onclick="save()">保存する</button></div>`}
function setKind(k){draft.kind=k;renderNew()}
function toggleClub(c){const a=draft.clubs;const i=a.indexOf(c);i>=0?a.splice(i,1):a.push(c);renderNew()}
function vdur(f){return new Promise(r=>{const v=document.createElement('video'),u=URL.createObjectURL(f);v.preload='metadata';v.onloadedmetadata=()=>{r(v.duration||0);URL.revokeObjectURL(u)};v.onerror=()=>{r(0);URL.revokeObjectURL(u)};setTimeout(()=>r(0),5000);v.src=u})}
async function addFiles(fl){for(const f of fl){if(f.size>1536*1024*1024){alert('「'+(f.name||'動画')+'」は大きすぎて取り込めません(1.5GBまで)。短く切ってください');continue}
  if(f.type.startsWith('video')){const d=await vdur(f);if(d>600){alert('「'+(f.name||'動画')+'」は長すぎます(10分まで)。短く切ってください');continue}}const id=uid();await put('media',{id,type:f.type||'video/mp4',blob:f,name:f.name});draft.media.push(id)}log('import',{n:fl.length});renderNew()}
async function rmMedia(i){const id=draft.media[i];draft.media.splice(i,1);if(draft.best===id)draft.best=null;await del('media',id);renderNew()}
async function save(){await put('sessions',draft);log('save',{kind:draft.kind,media:draft.media.length});cur=draft.id;draft=null;go('detail',cur)}

async function renderList(){
  $('app').innerHTML=`<div class="top"><h1>一覧</h1></div><div class="wrap">${sessions.length?sessions.map(s=>`<button class="row" onclick="go('detail','${s.id}')"><div><b>${fmt(s.date)}${s.kind==='round'?(s.active?' ・ラウンド中':' ・ラウンド'):''}</b><small>${esc(s.place||'場所なし')} ・ 動画/写真 ${s.media.length}</small></div><span class="pill">調子 ${s.cond}</span></button>`).join(''):'<div class="hint">まだ記録がありません。「入力」から1件つくってください。</div>'}</div>`}

let sel=0;
function pick(i){sel=i;renderDetail()}
async function renderDetail(){
  const s=sessions.find(x=>x.id===cur);if(!s)return go('list');
  const id=s.media[sel]||s.media[0];let main='';
  if(id){const m=await get('media',id);if(m){const u=blobUrl(m.blob);main=m.type.startsWith('video')?`<video class="media" src="${u}" controls playsinline></video>`:`<img class="media" src="${u}">`}}
  const isBest=id&&s.best===id;
  $('app').innerHTML=`<div class="top"><button class="btn sm sub" onclick="go('list')">‹ 一覧</button><div style="display:flex;gap:8px"><button class="btn sm" onclick="shareCard()">共有</button><button class="btn sm sub" onclick="edit()">編集</button></div></div>
  <div class="wrap">
  <div style="display:flex;justify-content:space-between;align-items:flex-start"><div><h1>${fmt(s.date)}</h1><div class="hint" style="font-size:14px">${esc(s.place)}${s.kind==='round'?' ・ラウンド':''}</div></div><span class="pill">調子 ${s.cond}</span></div>
  ${main}
  ${s.media.length?`<div class="thumbs">${await thumbs(s.media,sel,s.best,false)}</div><button class="btn ${isBest?'':'sub'}" onclick="toggleBest()">${isBest?'★ ベストの1打(タップで外す)':'☆ これをベストの1打にする'}</button>`:''}
  <div><div class="lab">メモ</div><div class="prev">${esc(s.memo)||'—'}</div></div>
  <div><div class="lab">使ったクラブ</div><div class="chips">${s.clubs.map(c=>`<span class="chip">${c}</span>`).join('')||'—'}</div></div>
  ${s.kind==='round'?'<button class="btn" onclick="openRPre()">ホールごとに書き出す</button>':''}
  <button class="btn sub" onclick="remove()">この記録を削除</button></div>`}
async function toggleBest(){const s=sessions.find(x=>x.id===cur);const id=s.media[sel]||s.media[0];s.best=s.best===id?null:id;await put('sessions',s);log('best',{on:!!s.best});renderDetail()}
function edit(){draft=JSON.parse(JSON.stringify(sessions.find(x=>x.id===cur)));go('new')}
async function remove(){if(!confirm('削除しますか?'))return;const s=sessions.find(x=>x.id===cur);for(const m of s.media)await del('media',m);await del('sessions',cur);log('delete',{});go('list')}
let fr=0;
async function shareCard(){fr=0;const s=sessions.find(x=>x.id===cur);const id=s.best||s.media[0];
  let img=null;if(id){const m=await get('media',id);if(m){img=await frameOf(m)}}
  window._card={s,img};log('card_open',{});drawSheet()}
function frameOf(m){return new Promise(res=>{const u=URL.createObjectURL(m.blob);
  if(m.type.startsWith('video')){const v=document.createElement('video');v.muted=true;v.playsInline=true;v.src=u;v.onloadeddata=()=>{v.currentTime=Math.min(0.5,(v.duration||1)/2)};v.onseeked=()=>res(v);v.onerror=()=>res(null)}
  else{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=u}})}
function paint(cv,{s,img},f){const W=cv.width=1080,H=cv.height=1920,c=cv.getContext('2d');
  c.fillStyle='#17261F';c.fillRect(0,0,W,H);
  const draw=(x,y,w,h)=>{if(!img){c.fillStyle='#D9D3C0';c.fillRect(x,y,w,h);return}
    const iw=img.videoWidth||img.width,ih=img.videoHeight||img.height,r=Math.max(w/iw,h/ih),dw=iw*r,dh=ih*r;
    c.save();c.beginPath();c.rect(x,y,w,h);c.clip();c.drawImage(img,x+(w-dw)/2,y+(h-dh)/2,dw,dh);c.restore()};
  const d=new Date(s.date+'T00:00:00'),ds=(d.getMonth()+1)+'/'+d.getDate();
  c.textBaseline='alphabetic';
  if(f===0){draw(0,0,W,H);const g=c.createLinearGradient(0,H-700,0,H);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.75)');c.fillStyle=g;c.fillRect(0,H-700,W,700);
    c.fillStyle='#fff';c.font='bold 150px -apple-system,sans-serif';c.fillText(ds,70,H-300);
    c.font='46px -apple-system,sans-serif';c.fillText((s.place||'')+(s.kind==='round'?'  ROUND':'  PRACTICE'),70,H-220);
    if(s.best){c.fillStyle='#C8E36B';c.font='bold 48px -apple-system,sans-serif';c.fillText('★ BEST SHOT',70,H-140)}}
  else{c.fillStyle='#F4F1E8';c.fillRect(0,0,W,H);draw(90,150,900,1200);
    c.fillStyle='#1F4D3A';c.font='bold 120px -apple-system,sans-serif';c.fillText(ds,90,1500);
    c.fillStyle='#4A5750';c.font='44px -apple-system,sans-serif';c.fillText(s.place||'',90,1580);
    if(s.memo){c.font='40px -apple-system,sans-serif';c.fillText(s.memo.split('\n')[0].slice(0,24),90,1660)}}
  // app name: always on
  c.font='bold 56px -apple-system,sans-serif';c.fillStyle=f===0?'#fff':'#1F4D3A';const t='Shotlog';c.fillText(t,W-90-c.measureText(t).width,H-70)}
function drawSheet(){let o=$('sheet');if(!o){o=document.createElement('div');o.id='sheet';o.style.cssText='position:fixed;inset:0;background:#F4F1E8;z-index:9;display:flex;flex-direction:column;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 20px 20px;align-items:center';document.body.appendChild(o)}
  o.innerHTML='<div class="seg" style="width:100%"><button class="'+(fr===0?'on':'')+'" onclick="fr=0;drawSheet()">フルスクリーン</button><button class="'+(fr===1?'on':'')+'" onclick="fr=1;drawSheet()">ポラロイド</button></div><canvas id="cv" style="flex:1;min-height:0;aspect-ratio:9/16;border-radius:12px;max-width:100%"></canvas><button class="btn" onclick="shareImg()">共有する</button><button class="btn sub" onclick="$(\'sheet\').remove()">閉じる</button>';
  paint($('cv'),window._card,fr)}
async function shareImg(){const cv=$('cv');const b=await new Promise(r=>cv.toBlob(r,'image/png'));const f=new File([b],'shotlog.png',{type:'image/png'});log('share',{frame:fr});
  if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(()=>{});else{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='shotlog.png';a.click()}}
async function exportEvents(){const ev=await all('events');const t=ev.length+'件の操作記録\n'+JSON.stringify(ev.slice(-200));const b=new Blob([t],{type:'text/plain'});const f=new File([b],'shotlog-events.txt',{type:'text/plain'});
  if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(()=>{});else{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='shotlog-events.txt';a.click()}}


// ---------- round ----------
let R=null,stream=null,mr=null,chunks=[],rec=false,timer=null,tick=null,t0=0,rsel=1;
const PARS=[3,4,5];
const pname=()=>{try{return localStorage.getItem('shotlog_name')||'PLAYER'}catch(_){return 'PLAYER'}};
function newRound(){return {...newDraft('round'),active:true,hole:1,pars:{},yards:{},clips:[],hist:[]}}
const cnt=h=>R.clips.filter(c=>c.hole===h).length;
function stopCam(){if(rec){try{mr.onstop=null;mr.stop()}catch(_){}rec=false;clearTimeout(timer);clearInterval(tick)}
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
async function startCam(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30}},audio:true});
  const v=$('cam');if(v){v.srcObject=stream;v.play().catch(()=>{})}}catch(e){stream=null;const m=$('camerr');if(m)m.style.display='block'}}
async function renderRound(){
  R=sessions.find(s=>s.active&&s.kind==='round')||null;
  if(!R){R=newRound();await put('sessions',R);log('round_start',{})}
  try{if(!localStorage.getItem('shotlog_name')){const n=prompt('オーバーレイに出す名前','');localStorage.setItem('shotlog_name',((n||'').trim())||'PLAYER')}}catch(_){}
  $('app').innerHTML=`<div class="top"><button class="btn sm sub" onclick="go('new')">‹ 戻る</button><b>ラウンド中</b><button class="btn sm" onclick="endRound()">確認・書き出し</button></div>
  <div class="wrap" style="gap:10px;padding-bottom:110px">
   <div style="display:flex;align-items:baseline;gap:12px"><div id="hn" style="font-size:44px;font-weight:700;line-height:1"></div><div id="sn" style="font-size:20px;font-weight:700;color:var(--g)"></div></div>
   <div style="display:flex;gap:8px;align-items:center"><div class="chips" id="pc"></div><input id="yd" type="text" inputmode="numeric" placeholder="ヤード" style="width:96px;height:40px;padding:0 10px" oninput="setYard(this.value)"></div>
   <div id="vf" style="position:relative;height:36vh;aspect-ratio:9/16;margin:0 auto;border-radius:16px;overflow:hidden;background:#17261F">
    <video id="cam" autoplay muted playsinline style="width:100%;height:100%;object-fit:cover"></video>
    <div id="ov" style="position:absolute;right:6px;top:6px;border-radius:5px;overflow:hidden;font-weight:700;font-size:10px;color:#fff;text-align:center"></div>
    <div id="rp" style="display:none;position:absolute;left:8px;bottom:8px;background:#C0392B;color:#fff;border-radius:12px;padding:3px 10px;font-size:12px;font-weight:700"></div>
    <div id="camerr" style="display:none;position:absolute;inset:0;color:#fff;font-size:12px;padding:30px 12px;text-align:center">カメラが使えません。下のボタンで標準カメラから撮れます</div>
   </div>
   <input type="file" id="rf" accept="video/*" capture="environment" hidden onchange="if(this.files[0])addClip(this.files[0]);this.value=''">
   <div style="display:flex;justify-content:center"><button id="rb" onclick="toggleRec()" aria-label="録画" style="width:84px;height:84px;border-radius:42px;border:6px solid var(--g);background:#fff;padding:0"><div id="rd" style="margin:auto;width:56px;height:56px;border-radius:28px;background:#C0392B"></div></button></div>
   <button class="btn sub" style="height:44px;font-size:14px" onclick="$('rf').click()">標準カメラで撮る(手ブレ補正・高画質)</button>
   <div id="err" style="display:none;background:#F8D7D2;color:#8A2A1E;border-radius:12px;padding:10px 14px;font-size:13px"></div>
   <div id="saved" class="hint" style="text-align:center"></div>
   <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 8px 6px 14px"><div id="last" style="font-size:14px"></div><button id="undo" class="btn sm sub" onclick="undo()"></button></div>
  </div>
  <div style="position:fixed;left:0;right:0;bottom:0;padding:10px 20px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)"><button class="btn" style="background:var(--lime);color:var(--ink)" onclick="nextHole()">次のホール ›</button></div>`;
  upd();startCam()}
function upd(){if(view!=='round'||!R)return;const h=R.hole,par=R.pars[h],yd=R.yards[h];
  $('hn').textContent=h+'番';$('sn').textContent=(cnt(h)+1)+'打目 撮影';
  $('pc').innerHTML=PARS.map(p=>`<button class="chip ${par===p?'on':''}" onclick="setPar(${p})">Par ${p}</button>`).join('');
  const y=$('yd');if(document.activeElement!==y)y.value=yd||'';
  $('ov').innerHTML=`<div style="background:#1F4D3A;padding:3px 10px">${esc(pname())}</div><div style="background:#17261F;padding:3px 10px;white-space:nowrap">HOLE ${h}${par?' | PAR '+par:''}${yd?' | '+esc(yd)+' YDS':''}</div>`;
  $('rd').style.borderRadius=rec?'8px':'28px';$('rd').style.width=$('rd').style.height=rec?'30px':'56px';
  const rp=$('rp');rp.style.display=rec?'block':'none';
  const here=R.clips.filter(c=>c.hole===h),lk=here.length?here[here.length-1].kb:0;$('saved').textContent=here.length?`${h}番に ${here.length}本保存済み(最後の1本 ${lk}KB)`:`${h}番はまだ保存なし`;
  const hi=R.hist[R.hist.length-1];
  $('last').textContent=!hi?'まだ操作はありません':hi.t==='clip'?`${hi.hole}番 ${hi.n}打目 を保存しました`:`${hi.from}番 → ${R.hole}番`;
  const u=$('undo');u.textContent=!hi?'—':hi.t==='clip'?'撮り直す':'戻す';u.disabled=!hi;u.style.opacity=hi?1:.4}
async function setPar(p){R.pars[R.hole]=R.pars[R.hole]===p?undefined:p;if(R.pars[R.hole]===undefined)delete R.pars[R.hole];await put('sessions',R);upd()}
let ysave=null;function setYard(v){R.yards[R.hole]=v;if(!v)delete R.yards[R.hole];$('ov').children[1].textContent='HOLE '+R.hole+(R.pars[R.hole]?' | PAR '+R.pars[R.hole]:'')+(v?' | '+v+' YDS':'');clearTimeout(ysave);ysave=setTimeout(()=>put('sessions',R),400)}
function toggleRec(){rec?stopRec():startRec()}
function startRec(){if(!stream||typeof MediaRecorder==='undefined'){$('rf').click();return}
  const mt=['video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'';
  chunks=[];mr=new MediaRecorder(stream,Object.assign(mt?{mimeType:mt}:{},{videoBitsPerSecond:14000000}));mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  mr.onstop=async()=>{const b=new Blob(chunks,{type:mr.mimeType||mt||'video/mp4'});if(!b.size){msg('録画が空でした(type:'+(mr.mimeType||mt||'なし')+')');return}try{await addClip(b)}catch(e){msg('保存エラー: '+(e.name||e))}};
  mr.onerror=e=>msg('録画エラー: '+(e.error&&e.error.name||'?'));mr.start(1000);rec=true;t0=Date.now();timer=setTimeout(stopRec,10000);
  tick=setInterval(()=>{const r=$('rp');if(r)r.textContent='● 撮影中 '+Math.min(10,Math.ceil((Date.now()-t0)/1000))+'/10秒'},200);upd()}
function stopRec(){if(!rec)return;rec=false;clearTimeout(timer);clearInterval(tick);try{mr.stop()}catch(_){}upd()}
function msg(t){const e=$('err');if(e){e.textContent=t;e.style.display='block'}}
async function addClip(blob){const id=uid(),n=cnt(R.hole)+1;await put('media',{id,type:blob.type||'video/mp4',blob,name:''});
  R.media.push(id);R.clips.push({id,hole:R.hole,ex:false,kb:Math.round(blob.size/1024)});R.hist.push({t:'clip',id,hole:R.hole,n});await put('sessions',R);log('clip',{hole:R.hole});upd()}
async function undo(){const hi=R.hist.pop();if(!hi)return;
  if(hi.t==='clip'){R.clips=R.clips.filter(c=>c.id!==hi.id);R.media=R.media.filter(x=>x!==hi.id);await del('media',hi.id)}
  else R.hole=hi.from;
  await put('sessions',R);log('undo',{t:hi.t});upd()}
async function nextHole(){if(R.hole>=18)return;R.hist.push({t:'hole',from:R.hole});R.hole++;await put('sessions',R);log('next_hole',{});upd()}
function endRound(){rsel=R.hole;go('rpre')}
function openRPre(){R=sessions.find(x=>x.id===cur);rsel=1;go('rpre')}
async function renderRPre(){
  if(!R)return go('list');
  const h=rsel,cl=R.clips.filter(c=>c.hole===h),live=R.clips.filter(c=>!c.ex);
  const grid=Array.from({length:18},(_,i)=>{const n=i+1,k=R.clips.filter(c=>c.hole===n&&!c.ex).length;
    return `<button onclick="rsel=${n};renderRPre()" style="height:46px;border:0;border-radius:10px;font-weight:700;background:${n===h?'var(--g)':k?'var(--chip)':'transparent'};color:${n===h?'#fff':k?'var(--g)':'#9a9a8a'};border:${k||n===h?'0':'1px dashed var(--line)'}">${n}<div style="font-size:10px;font-weight:400">${k?k+'打':'—'}</div></button>`}).join('');
  let tiles='';for(const c of cl){const m=await get('media',c.id);if(!m)continue;const u=blobUrl(m.blob);
    tiles+=`<div onclick="playQueue(['${c.id}'],0)" style="position:relative;width:88px;flex:0 0 auto;cursor:pointer"><div class="th" style="width:88px;height:156px;opacity:${c.ex?.35:1}"><video src="${u}#t=0.1" muted playsinline preload="metadata"></video></div><button onclick="event.stopPropagation();toggleEx('${c.id}')" style="position:absolute;right:-4px;top:-4px;width:28px;height:28px;border-radius:14px;border:0;background:#17261F;color:#fff">${c.ex?'↺':'×'}</button></div>`}
  const par=R.pars[h],yd=R.yards[h];
  $('app').innerHTML=`<div class="top"><button class="btn sm sub" onclick="${R.active?"go('round')":"go('detail',R.id)"}">‹ ${R.active?'撮影に戻る':'詳細'}</button><b>確認して書き出す</b><span></span></div>
  <div class="wrap">
   <div class="hint">全${live.length}打 ・ 1ホールずつ縦動画にします</div>
   <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:6px">${grid}</div>
   <div class="lab" style="margin:0">${h}番 ${par?'Par '+par:''} ${yd?yd+'yd':''}</div>
   <div style="position:relative;height:40vh;aspect-ratio:9/16;margin:0 auto;border-radius:16px;overflow:hidden;background:#17261F">
    <video id="pvv" playsinline controls style="width:100%;height:100%;object-fit:cover"></video>
    <div style="position:absolute;right:6px;top:6px;border-radius:5px;overflow:hidden;font-weight:700;font-size:10px;color:#fff;text-align:center;pointer-events:none"><div style="background:#1F4D3A;padding:3px 10px">${esc(pname())}</div><div style="background:#17261F;padding:3px 10px;white-space:nowrap">HOLE ${h}${par?' | PAR '+par:''}${yd?' | '+esc(yd)+' YDS':''}</div></div>
    <div id="pvn" style="position:absolute;left:8px;top:8px;background:rgba(0,0,0,.55);color:#fff;border-radius:10px;padding:2px 8px;font-size:11px;pointer-events:none"></div>
    <div style="position:absolute;right:10px;bottom:46px;color:rgba(255,255,255,.9);font-weight:700;font-size:11px;pointer-events:none">Shotlog</div>
   </div>
   <button class="btn sub" onclick="playHole(${h})" ${live.some(c=>c.hole===h)?'':'disabled style="opacity:.4"'}>▶ このホールを通して見る</button>
   <div class="thumbs" style="gap:12px;padding:6px 4px">${tiles||'<div class="hint">このホールの動画はありません</div>'}</div>
   <div class="seg"><button class="${xq===1080?'on':''}" onclick="xq=1080;renderRPre()">高画質 1080p</button><button class="${xq===720?'on':''}" onclick="xq=720;renderRPre()">なめらか 720p</button></div>
   <button class="btn" onclick="exportHole(${h})" ${R.clips.some(c=>c.hole===h&&!c.ex)?'':'disabled style="opacity:.4"'}>${h}H を書き出す</button>
   <div id="xp" class="hint"></div>
   ${R.active?'<button class="btn sub" onclick="finishRound()">ラウンドを保存して終わる</button>':''}
  </div>`}
let pvq=[],pvi=0,pvu=null;
function playHole(h){playQueue(R.clips.filter(c=>c.hole===h&&!c.ex).map(c=>c.id),0)}
async function playQueue(ids,i){pvq=ids;pvi=i;log('preview',{n:ids.length});pvPlay()}
async function pvPlay(){const v=$('pvv');if(!v||pvi>=pvq.length){const n=$('pvn');if(n)n.textContent='';return}
  const m=await get('media',pvq[pvi]);if(!m)return;if(pvu)URL.revokeObjectURL(pvu);pvu=URL.createObjectURL(m.blob);
  v.src=pvu;v.onended=()=>{pvi++;pvPlay()};$('pvn').textContent=(pvi+1)+' / '+pvq.length;v.play().catch(()=>{})}
async function toggleEx(id){const c=R.clips.find(x=>x.id===id);c.ex=!c.ex;await put('sessions',R);renderRPre()}
async function finishRound(){R.active=false;await put('sessions',R);log('round_end',{clips:R.clips.length});cur=R.id;R=null;go('detail',cur)}
function drawOvl(c,W,h,par,yd){const k=W/390,t='HOLE '+h+(par?' | PAR '+par:'')+(yd?' | '+yd+' YDS':'');
  c.font=`bold ${12*k}px -apple-system,sans-serif`;const w=Math.max(150*k,c.measureText(t).width+24*k),x=W-12*k-w,y=16*k;
  c.textAlign='center';c.fillStyle='#1F4D3A';c.fillRect(x,y,w,22*k);c.fillStyle='#fff';c.fillText(pname(),x+w/2,y+16*k);
  c.fillStyle='#17261F';c.fillRect(x,y+22*k,w,24*k);c.fillStyle='#fff';c.fillText(t,x+w/2,y+39*k);c.textAlign='left'}
let xq=1080;
async function exportHole(h){
  const cl=R.clips.filter(c=>c.hole===h&&!c.ex);if(!cl.length)return;const xp=$('xp');
  const W=xq===720?720:1080,H=xq===720?1280:1920,cv=document.createElement('canvas');cv.width=W;cv.height=H;const c=cv.getContext('2d');
  const out=cv.captureStream(30),v=document.createElement('video');v.playsInline=true;v.setAttribute('playsinline','');
  try{const ac=new(window.AudioContext||window.webkitAudioContext)();ac.resume();const src=ac.createMediaElementSource(v),d=ac.createMediaStreamDestination();src.connect(d);d.stream.getAudioTracks().forEach(t=>out.addTrack(t))}catch(_){}
  const mt=['video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'';
  const rc=new MediaRecorder(out,Object.assign(mt?{mimeType:mt}:{},{videoBitsPerSecond:16000000})),ch=[];rc.ondataavailable=e=>e.data.size&&ch.push(e.data);
  const done=new Promise(r=>rc.onstop=r);rc.start();
  const par=R.pars[h],yd=R.yards[h];
  for(let i=0;i<cl.length;i++){
    xp.textContent=`書き出し中 ${i+1}/${cl.length} (画面を消さずにお待ちください)`;
    const m=await get('media',cl[i].id);if(!m)continue;const u=URL.createObjectURL(m.blob);v.src=u;
    await new Promise(r=>{v.onloadeddata=r;v.onerror=r;setTimeout(r,4000)});
    await v.play().catch(()=>{});
    await new Promise(res=>{let fin=false;const end=()=>{if(!fin){fin=true;res()}};v.onended=end;setTimeout(end,12500);
      const f=()=>{if(fin)return;c.fillStyle='#000';c.fillRect(0,0,W,H);const iw=v.videoWidth||W,ih=v.videoHeight||H,r=Math.max(W/iw,H/ih);
        c.drawImage(v,(W-iw*r)/2,(H-ih*r)/2,iw*r,ih*r);drawOvl(c,W,h,par,yd);
        const q=W/720;c.font=`bold ${30*q}px -apple-system,sans-serif`;c.fillStyle='rgba(255,255,255,.9)';c.textAlign='right';c.fillText('Shotlog',W-24*q,H-30*q);c.textAlign='left';requestAnimationFrame(f)};f()});
    v.pause();URL.revokeObjectURL(u)}
  rc.stop();await done;
  const ext=(mt||'').includes('mp4')?'mp4':'webm',blob=new Blob(ch,{type:mt||'video/webm'}),file=new File([blob],`shotlog-hole${h}.${ext}`,{type:blob.type});
  log('export',{hole:h,clips:cl.length});xp.innerHTML='できました。';
  const b=document.createElement('button');b.className='btn';b.textContent='共有 / 保存する';b.onclick=()=>{
    if(navigator.canShare&&navigator.canShare({files:[file]}))navigator.share({files:[file]}).catch(()=>{});else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click()}};
  xp.appendChild(b)}

open().then(()=>{if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});log('launch',{});render()});
</script></body></html>
